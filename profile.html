```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NutriCare | My Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f5;
            min-height: 100vh;
        }

        .navbar {
            background: #159447;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            color: #1f2937;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 35px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);
        }

        .avatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #dff7e7;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            margin: 0 auto 25px;
        }

        .grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            margin-bottom: 7px;

            color: #374151;

            font-weight: 600;
        }

        input,
        select {
            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #159447;

            box-shadow:
                0 0 0 3px
                rgba(21, 148, 71, 0.1);
        }

        .btn {
            margin-top: 25px;

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #159447;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background: #107a39;
        }

        .success {
            background: #dcfce7;

            color: #166534;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #159447;

            text-decoration: none;

            font-weight: 600;
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .container {
                margin-top: 25px;
            }

            .profile-card {
                padding: 25px 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🥗 NutriCare
        </div>

        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </div>


    <div class="container">

        <div class="title">

            <h1>
                👤 My Profile
            </h1>

            <p>
                Manage your personal and nutrition information.
            </p>

        </div>


        <div class="profile-card">

            <div class="avatar">
                👤
            </div>


            {% if success %}

            <div class="success">
                {{ success }}
            </div>

            {% endif %}


            <form
                method="POST"
                action="/profile"
            >

                <div class="grid">

                    <div class="form-group full">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            placeholder="Enter your full name"
                            value="{{ profile['full_name'] if profile else '' }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            value="{{ profile['email'] if profile else '' }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter phone number"
                            value="{{ profile['phone'] if profile else '' }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            min="1"
                            max="120"
                            placeholder="Enter age"
                            value="{{ profile['age'] if profile else '' }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Gender
                        </label>

                        <select name="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option
                                value="Male"
                                {% if profile and profile['gender'] == 'Male' %}
                                selected
                                {% endif %}
                            >
                                Male
                            </option>

                            <option
                                value="Female"
                                {% if profile and profile['gender'] == 'Female' %}
                                selected
                                {% endif %}
                            >
                                Female
                            </option>

                            <option
                                value="Other"
                                {% if profile and profile['gender'] == 'Other' %}
                                selected
                                {% endif %}
                            >
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Height (cm)
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="height"
                            placeholder="Example: 170"
                            value="{{ profile['height'] if profile else '' }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Weight (kg)
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="weight"
                            placeholder="Example: 65"
                            value="{{ profile['weight'] if profile else '' }}"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Health / Nutrition Goal
                        </label>

                        <select name="goal">

                            <option value="">
                                Select your goal
                            </option>

                            <option
                                value="Weight Loss"
                                {% if profile and profile['goal'] == 'Weight Loss' %}
                                selected
                                {% endif %}
                            >
                                Weight Loss
                            </option>

                            <option
                                value="Weight Gain"
                                {% if profile and profile['goal'] == 'Weight Gain' %}
                                selected
                                {% endif %}
                            >
                                Weight Gain
                            </option>

                            <option
                                value="Maintain Weight"
                                {% if profile and profile['goal'] == 'Maintain Weight' %}
                                selected
                                {% endif %}
                            >
                                Maintain Weight
                            </option>

                            <option
                                value="Build Muscle"
                                {% if profile and profile['goal'] == 'Build Muscle' %}
                                selected
                                {% endif %}
                            >
                                Build Muscle
                            </option>

                            <option
                                value="Healthy Lifestyle"
                                {% if profile and profile['goal'] == 'Healthy Lifestyle' %}
                                selected
                                {% endif %}
                            >
                                Healthy Lifestyle
                            </option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    💾 Save Profile
                </button>

            </form>


            <a
                href="/dashboard"
                class="back"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
```
